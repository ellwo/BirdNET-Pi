# Global notification settings
notify_quiet_hours_start: ""    # e.g., "22:00" for 10 PM (empty = no quiet hours)
notify_quiet_hours_end: ""      # e.g., "06:00" for 6 AM

# Localization and Species Display
language: en  # Language code for UI and species name translation
species_display_mode: full  # Options: "full" (Common Name (Scientific Name)), "common_name", "scientific_name"
timezone: UTC

# Field Mode and GPS Settings
enable_gps: false
gps_update_interval: 5.0

# Analysis Configuration
privacy_threshold: 10.0

# MQTT Integration Settings
enable_mqtt: false
mqtt_broker_host: localhost
mqtt_broker_port: 1883
mqtt_username: ""
mqtt_password: ""
mqtt_topic_prefix: birdnet
mqtt_client_id: birdnet-pi

# Webhook Integration Settings
enable_webhooks: true
webhook_urls: ["https://n8n.nabaai.com/webhook/c7b55fc1-812d-4122-be6e-ebc0d73752cd"]  # List of webhook URLs, e.g., ["http://example.com/webhook", "http://another.com/hook"]
webhook_events: detection,health,gps,system,audio_file,detection_with_taxa
webhook_include_audio_data: true  # Set to true to include base64 encoded audio files in webhooks (increases payload size significantly)

# System Update Configuration
# Controls how the system checks for and notifies about updates
updates:
  # Enable periodic update checks
  # When true, the system will check for updates at the specified interval
  check_enabled: true

  # How often to check for updates (in hours)
  # Default: 6 hours. Minimum recommended: 1 hour to avoid excessive API calls
  check_interval_hours: 6

  # Show update banner when updates are available
  # When true, a banner appears at the top of all pages when an update is available
  show_banner: true

  # Show warning banner when running a development version
  # Development versions are non-tagged git commits (useful for testing)
  show_development_warning: true

  # Automatically check for updates when the system starts
  # This ensures you're notified of updates even if periodic checks are disabled
  auto_check_on_startup: true

  # Git configuration for updates
  git_remote: origin  # Git remote name (usually 'origin' for the main repository)
  git_branch: main    # Git branch to track for updates (usually 'main' or 'master')

# Detection Processing
detections_endpoint: "http://127.0.0.1:8888/api/detections/"  # Where to send detections (can be remote)
